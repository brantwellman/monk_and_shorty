<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monk &amp; Shorty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/viewer.css">
<style>
/* Gallery: a short list of characters, each linking to its 3D viewer */
body { overflow: auto; }
main {
  max-width: 640px; margin: 0 auto;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
h1 { margin: 0; font-size: clamp(34px, 7vw, 52px); letter-spacing: -0.02em; line-height: 1; }
.lede { margin: 8px 0 0; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none;
}
a.item:hover { border-color: var(--accent); }
a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.name { font-size: 22px; font-weight: 700; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto; text-align: right; }
.soon { opacity: 0.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Monk &amp; Shorty</h1>
    <p class="lede">3D models of two stuffed animals, built in code</p>
  </header>
  <ul>
    <li>
      <a class="item" href="characters/shorty/">
        <span class="dot" style="background:#c8242f; box-shadow: inset 0 -3px 0 #5b3fb0"></span>
        <span class="name">Shorty</span>
        <span class="meta">baby emperor penguin<br>6¼ in</span>
      </a>
    </li>
    <li>
      <a class="item" href="characters/monk/">
        <span class="dot" style="background:#1f4f9a; box-shadow: inset 0 -3px 0 #1fa7a0"></span>
        <span class="name">Monk</span>
        <span class="meta">squirrel monkey<br>7¾ in</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
